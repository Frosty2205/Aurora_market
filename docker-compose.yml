services:
  postgres:
    image: postgres:16
    container_name: aurora_market_db
    environment:
      POSTGRES_DB: aurora_market
      POSTGRES_USER: aurora
      POSTGRES_PASSWORD: aurora
    ports:
      - "5432:5432"
    volumes:
      # Los scripts son ejecutados en orden alfabético al crear el contenedor por primera vez
      - ./sql:/docker-entrypoint-initdb.d:ro
      - datos_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aurora -d aurora_market"]
      interval: 5s
      retries: 10

  # Proceso de ingesta. No arranca con "up": se lanza a demanda con
  # docker compose run --rm ingesta inicial
  # docker compose run --rm ingesta delta
  ingesta:
    build: ./ingesta
    profiles: ["ingesta"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: aurora_market
      PGUSER: aurora
      PGPASSWORD: aurora
      DATOS_DIR: /datos
    volumes:
      - ./datos:/datos:ro     # Aquí van los CSV del ERP
      - ./sql:/app/sql:ro     # Funciones de carga (06_funciones_ingesta.sql)
      - ./ingesta/ingesta.py:/app/ingesta.py:ro # para no tener que hacer build de ingesta todo el rato
  
  # Panel de seguimiento (lee solo el esquema de consume). Arranca con "up": http://localhost:8501
  panel:
    build: ./panel
    container_name: aurora_market_panel
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: aurora_market
      PGUSER: aurora
      PGPASSWORD: aurora
    ports:
      - "8501:8501"
    volumes:
      - ./panel/app.py:/app/app.py:ro # sin reconstruir la imagen al cambiar el panel

volumes:
  datos_pg: